version: "3.9"

services:

  web:
    build: .

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn myjobs.wsgi:application --bind 0.0.0.0:8000
      "

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    depends_on:
      - db
      - redis

    env_file:
      - .env

  db:
    image: postgres:16

    environment:
      POSTGRES_DB: myjobs_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data/

  redis:
    image: redis:7

  celery:
    build: .

    command: celery -A myjobs worker -l info

    volumes:
      - .:/app

    depends_on:
      - redis
      - db

    env_file:
      - .env

  celery-beat:
    build: .

    command: celery -A myjobs beat -l info

    volumes:
      - .:/app

    depends_on:
      - redis
      - db

    env_file:
      - .env

  nginx:
    image: nginx:latest

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - web

volumes:
  postgres_data: